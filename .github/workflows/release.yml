name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install OpenSSL headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - run: cargo test

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Set archive name
        shell: bash
        run: echo "ARCHIVE=onyphe-rs-$GITHUB_REF_NAME-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Keeps bsdtar from adding AppleDouble ._ entries on macOS.
          COPYFILE_DISABLE: 1
        run: |
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/onyphe-rs" README.md "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          if [[ $RUNNER_OS == macOS ]]; then
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          else
            sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:ARCHIVE.zip"
          New-Item -ItemType Directory -Path $env:ARCHIVE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/onyphe-rs.exe", README.md -Destination $env:ARCHIVE
          Compress-Archive -Path $env:ARCHIVE -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$archive.sha256", "$hash  $archive`n")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
