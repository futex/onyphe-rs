[package]
name = "onyphe-rs"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.36", features = ["full", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
colored = "2.1"
indicatif = "0.17"
directories = "5.0"
rust-ini = "0.21"
urlencoding = "2.1"
